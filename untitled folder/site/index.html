<script>
  async function fetchStatuses() {
    const res = await fetch('https://classmate-catchup.alessandra-pastor.workers.dev/api/statuses');
    const data = await res.json();
    const board = document.getElementById('status-board');
    board.innerHTML = data.map(entry => `
      <div>
        <strong>${entry.name}</strong> (${entry.course}) - ${entry.type}<br>
        <em>${entry.message}</em><br>
        <small>${entry.timestamp}</small>
        <hr>
      </div>
    `).join('');
  }

  document.getElementById('status-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = new FormData(e.target);
    const payload = {
      name: form.get('name'),
      course: form.get('course'),
      type: form.get('type'),
      message: form.get('message'),
    };
    await fetch('https://classmate-catchup.alessandra-pastor.workers.dev/api/statuses', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    e.target.reset();
    fetchStatuses();
  });

  fetchStatuses();
</script>
