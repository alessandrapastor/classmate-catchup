<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Classmate Catch-Up</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f9f9f9;
      color: #222;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      font-size: 2.5em;
      margin-bottom: 30px;
    }

    form {
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.05);
      margin-bottom: 40px;
    }

    input, select, textarea, button {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1em;
    }

    button {
      background-color: #0077cc;
      color: white;
      border: none;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background-color: #005fa3;
    }

    h2 {
      margin-top: 0;
    }

    .post {
      background: #fff;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    .post strong {
      font-size: 1.1em;
    }

    .post small {
      display: block;
      margin-top: 5px;
      color: #666;
    }
  </style>
</head>
<body>
  <h1>Classmate Catch-Up Board</h1>

  <form id="status-form">
    <input type="text" name="name" placeholder="Your name" required>
    <input type="text" name="course" placeholder="Course (e.g., CS101)" required>
    <select name="type" required>
      <option value="">Select status</option>
      <option value="Need Help">Missed Class / Need Help</option>
      <option value="Available">Available to Study</option>
      <option value="Busy">Busy Today</option>
    </select>
    <textarea name="message" placeholder="Write your message..." required></textarea>
    <button type="submit">Post Status</button>
  </form>

  <h2>Current Posts</h2>
  <div id="status-board">Loading posts...</div>

  <script>
    const API_URL = "https://classmate-catchup.alessandra-pastor.workers.dev/api/statuses";

    async function fetchStatuses() {
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        const board = document.getElementById('status-board');
        board.innerHTML = data.map(entry => `
          <div class="post">
            <strong>${entry.name}</strong> (${entry.course}) - ${entry.type}<br>
            <em>${entry.message}</em>
            <small>${new Date(entry.timestamp).toLocaleString()}</small>
          </div>
        `).join('');
      } catch (err) {
        document.getElementById('status-board').innerText = 'Failed to load posts.';
        console.error('Error fetching statuses:', err);
      }
    }

    document.getElementById('status-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = new FormData(e.target);
      const payload = {
        name: form.get('name'),
        course: form.get('course'),
        type: form.get('type'),
        message: form.get('message'),
      };
      try {
        await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        e.target.reset();
        fetchStatuses();
      } catch (err) {
        alert('Failed to post status. Try again later.');
        console.error('Error posting status:', err);
      }
    });

    fetchStatuses();
  </script>
</body>
</html>
